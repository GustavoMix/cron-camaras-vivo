[project]
name = "cron-camaras-vivo"
version = "1.0.0"
description = "Weekly index of publicly published live cameras"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into adapter internals on purpose, to parse fixtures without HTTP.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
