name: CI

on:
  push:
    branches: ["**"]
    # Dataset refresh commits touch only data/, and they are produced by a run
    # that already passed CI.
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check cameras tests

      - name: Test
        run: pytest tests -q

      - name: Smoke-check the CLI
        run: python -m cameras list
